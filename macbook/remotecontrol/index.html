<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MacBook — Remote Control</title>
<style>
  :root{
    --bg:#07090f; --panel:#12151d; --line:#232936; --txt:#dde3ed;
    --dim:#7c879b; --accent:#6366f1; --ok:#22c55e; --warn:#f59e0b; --bad:#f87171;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
  #bar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel);
    border-bottom:1px solid var(--line);flex-wrap:wrap}
  .pill{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}
  .dot.on{background:var(--ok)} .dot.off{background:var(--bad)}
  button{background:#1b2030;color:var(--txt);border:1px solid var(--line);
    border-radius:8px;padding:7px 10px;font-size:12px;font-weight:600}
  button:active{transform:translateY(1px)}
  button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  button.danger{border-color:#7f1d1d;color:#fca5a5}
  .spacer{flex:1}
  #stage{position:relative;width:100%;height:calc(100% - 96px);
    background:#000;overflow:hidden;touch-action:none}
  canvas{position:absolute;transform-origin:0 0;image-rendering:auto}
  #cursor{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;
    border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #000,0 0 8px rgba(0,0,0,.6);
    pointer-events:none;display:none;z-index:5}
  #cursor.show{display:block}
  #keys{display:flex;gap:6px;padding:6px 8px;background:var(--panel);
    border-top:1px solid var(--line);overflow-x:auto}
  #keys button{white-space:nowrap;font-size:11px;padding:6px 9px}
  /* iOS will not open the keyboard for an element at left:-9999px — it must
     be within the viewport. Keep it on-screen but invisible. */
  #hidden{position:fixed;bottom:0;left:0;width:1px;height:1px;opacity:0;
    border:0;padding:0;font-size:16px;z-index:-1}
  #toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);
    background:rgba(0,0,0,.85);border:1px solid var(--line);padding:8px 14px;
    border-radius:20px;font-size:12px;opacity:0;transition:.25s;pointer-events:none;z-index:20}
  #toast.show{opacity:1}
  #msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:24px;font-size:14px;color:var(--dim);z-index:10;
    touch-action:auto}
  #msg input,#msg button{touch-action:manipulation;font-size:16px}
</style>
</head>
<body>

<div id="bar">
  <span class="pill"><span class="dot" id="dot"></span><span id="state">connecting…</span></span>
  <span class="pill" id="mode-label">trackpad</span>
  <span class="pill" id="zoom-label">fit</span>
  <div class="spacer"></div>
  <button id="btn-mode">Trackpad</button>
  <button id="btn-left">L‑Click</button>
  <button id="btn-right">R‑Click</button>
  <button id="btn-kbd">⌨︎</button>
  <button id="btn-zoomout">−</button>
  <button id="btn-zoomin">+</button>
  <button id="btn-fit">Fit</button>
</div>

<div id="stage">
  <canvas id="screen"></canvas>
  <div id="cursor"></div>
  <div id="msg">Connecting to the MacBook…</div>
  <div id="toast"></div>
</div>

<div id="keys">
  <button data-mod="cmd">⌘</button>
  <button data-mod="ctrl">⌃</button>
  <button data-mod="alt">⌥</button>
  <button data-mod="shift">⇧</button>
  <button data-key="Escape">esc</button>
  <button data-key="Tab">tab</button>
  <button data-key="Enter">⏎</button>
  <button data-key="Backspace">⌫</button>
  <button data-key="ArrowUp">↑</button>
  <button data-key="ArrowDown">↓</button>
  <button data-key="ArrowLeft">←</button>
  <button data-key="ArrowRight">→</button>
</div>

<input id="hidden" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">

<script>
(function(){
  "use strict";
  const $ = id => document.getElementById(id);
  const canvas = $("screen"), ctx = canvas.getContext("2d", {alpha:false});
  const stage = $("stage"), cursorEl = $("cursor"), hidden = $("hidden");

  const Q = new URLSearchParams(location.search);

  // TOKEN HANDLING.
  // Precedence: ?token= (explicit) > previously saved. An explicit one is
  // remembered so the connector panel can link here with NO secret in the URL —
  // a link with a token in it gets copied, screenshotted and pasted into chats,
  // which is exactly how the first token leaked.
  let TOKEN = Q.get("token") || "";
  try {
    if (TOKEN) localStorage.setItem("jarvis_screen_token", TOKEN);
    else TOKEN = localStorage.getItem("jarvis_screen_token") || "";
  } catch (e) { /* private mode: fall through to the prompt */ }

  // WHERE THE SOCKET GOES.
  // Served BY the Mac (localhost) or through nginx in front of the tunnel
  // (sslip.io) -> the websocket is same-origin, just append /ws.
  // Served from VERCEL -> it cannot be same-origin: a Vercel rewrite proxies
  // HTTP but does NOT perform the `Upgrade: websocket` handshake, so the page
  // may come from vercel.app while the stream must go straight to the tunnel
  // host. `?host=` overrides for anyone running a different endpoint.
  const LOCAL = ["127.0.0.1", "localhost", "::1"].includes(location.hostname);
  const SAME_ORIGIN = LOCAL || location.hostname.endsWith("sslip.io");
  const BACKEND = (Q.get("host") || "kira-chat.167-233-158-179.sslip.io/macbook")
                    .replace(/^wss?:\/\//, "").replace(/\/$/, "");
  // The dashboard API. On vercel.app it is same-origin thanks to that app's
  // existing /api/* rewrite; on sslip.io it is same-origin directly. Only the
  // Mac-served copy has to reach out, and CORS on /api/* already allows it.
  const API_BASE = LOCAL ? "https://kira-chat.167-233-158-179.sslip.io" : "";

  const WS_URL = SAME_ORIGIN
    ? (location.protocol === "https:" ? "wss://" : "ws://")
        + location.host + location.pathname.replace(/\/$/, "")
        + "/ws?token=" + encodeURIComponent(TOKEN)
    : "wss://" + BACKEND + "/ws?token=" + encodeURIComponent(TOKEN);
  const HEALTH_URL = SAME_ORIGIN
    ? location.pathname.replace(/\/$/, "") + "/health?token=" + encodeURIComponent(TOKEN)
    : "https://" + BACKEND + "/health?token=" + encodeURIComponent(TOKEN);

  // A failed websocket handshake gives close code 1006 whether the key was
  // rejected or the Mac is simply gone — no status to read. /health does
  // return one (and echoes CORS for exactly this), so ask it why.
  async function diagnose(){
    try {
      const r = await fetch(HEALTH_URL, {cache: "no-store"});
      if (r.status === 401) return "badkey";
      return r.ok ? "ok" : "unreachable";
    } catch (e) { return "unreachable"; }
  }

  let ws = null, allowInput = false;
  let imgW = 0, imgH = 0;              // natural size of incoming frames
  let scale = 1, offX = 0, offY = 0;   // canvas placement in the stage
  let trackpad = true;                 // PLAN.md C.1: trackpad is the default
  let cur = {x:0.5, y:0.5};            // normalised cursor position
  const mods = new Set();

  function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("show");
    clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("show"),1600); }

  function setState(txt, cls){ $("state").textContent = txt;
    $("dot").className = "dot" + (cls ? " "+cls : ""); }

  function send(o){ if(ws && ws.readyState === 1){ o.mods = [...mods]; ws.send(JSON.stringify(o)); } }

  // ── layout: fit scale x user zoom, plus pan ───────────────────────────────
  // `scale` remains the EFFECTIVE scale, so cursor placement, coordinate
  // mapping and trackpad speed all keep working unchanged — only the way it is
  // computed changes. A 1470x956 desktop on a phone is unreadable at fit, which
  // is the whole reason this exists.
  let baseScale = 1, zoom = 1, panX = 0, panY = 0;
  const MIN_ZOOM = 1, MAX_ZOOM = 6;

  function fit(){ zoom = 1; panX = 0; panY = 0; layout(); }

  function layout(){
    if(!imgW) return;
    const sw = stage.clientWidth, sh = stage.clientHeight;
    baseScale = Math.min(sw/imgW, sh/imgH);
    scale = baseScale * zoom;
    const w = imgW*scale, h = imgH*scale;
    // Centre while the image fits; otherwise clamp the pan so the desktop can
    // never be dragged entirely off-screen and lost.
    offX = w <= sw ? (sw-w)/2 : Math.min(0, Math.max(sw-w, panX));
    offY = h <= sh ? (sh-h)/2 : Math.min(0, Math.max(sh-h, panY));
    panX = offX; panY = offY;
    canvas.style.width = imgW+"px"; canvas.style.height = imgH+"px";
    canvas.style.transform = `translate(${offX}px,${offY}px) scale(${scale})`;
    drawCursor();
    $("zoom-label").textContent = zoom > 1.02 ? zoom.toFixed(1)+"×" : "fit";
  }

  // Zoom ABOUT a point, so the pixel under your fingers stays put. That anchor
  // is what makes pinching feel like Photos instead of a zoom slider.
  function zoomAt(factor, cx, cy){
    const r = stage.getBoundingClientRect();
    const px = cx - r.left, py = cy - r.top;
    const next = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoom * factor));
    if (Math.abs(next - zoom) < 1e-4) return;
    const imgX = (px - offX) / scale, imgY = (py - offY) / scale;
    zoom = next;
    const after = baseScale * zoom;
    panX = px - imgX * after;
    panY = py - imgY * after;
    layout();
  }
  function zoomCentre(factor){
    zoomAt(factor, stage.clientWidth/2 + stage.getBoundingClientRect().left,
                   stage.clientHeight/2 + stage.getBoundingClientRect().top);
  }
  function drawCursor(){
    if(!trackpad){ cursorEl.classList.remove("show"); return; }
    cursorEl.classList.add("show");
    cursorEl.style.left = (offX + cur.x*imgW*scale) + "px";
    cursorEl.style.top  = (offY + cur.y*imgH*scale) + "px";
  }
  // stage point -> normalised screen coords (direct mode)
  function toNorm(clientX, clientY){
    const r = stage.getBoundingClientRect();
    return { x: Math.max(0,Math.min(1,((clientX-r.left)-offX)/(imgW*scale))),
             y: Math.max(0,Math.min(1,((clientY-r.top )-offY)/(imgH*scale))) };
  }
  function moveBy(dx, dy){
    // trackpad: relative motion, with a little acceleration for long swipes
    const speed = 1.6 / Math.max(scale, 0.25);
    cur.x = Math.max(0, Math.min(1, cur.x + (dx*speed)/(imgW*scale)));
    cur.y = Math.max(0, Math.min(1, cur.y + (dy*speed)/(imgH*scale)));
    drawCursor(); send({type:"move", x:cur.x, y:cur.y});
  }

  // ── websocket ─────────────────────────────────────────────────────────────
  function connect(){
    setState("connecting…","");
    ws = new WebSocket(WS_URL);
    ws.binaryType = "arraybuffer";

    ws.onopen = () => { setState("live","on"); $("msg").style.display="none"; };
    ws.onclose = async () => {
      setState("disconnected","off");
      if (await diagnose() === "badkey") {
        // Rotated or revoked. Reconnecting forever would just spin, so stop
        // and say the true reason instead of blaming a sleeping laptop.
        try { localStorage.removeItem("jarvis_screen_token"); } catch (e) {}
        askForToken("That key is no longer valid — it was most likely rotated. "
                    + "Enter your password to get the new one.");
        return;
      }
      $("msg").style.display="flex";
      $("msg").textContent="Disconnected — the MacBook may be asleep or the stream stopped. Reconnecting…";
      setTimeout(connect, 2500);
    };
    ws.onerror = () => setState("error","off");

    ws.onmessage = async (ev) => {
      if(typeof ev.data === "string"){
        const m = JSON.parse(ev.data);
        if(m.type === "hello"){
          allowInput = !!m.input;
          setState(allowInput ? "live · control" : "live · VIEW ONLY",
                   allowInput ? "on" : "");
          if(!allowInput) toast("View-only — input is disabled on the Mac");
        }
        return;
      }
      // Binary protocol "tiles/1".
      //   [1][w u16][h u16][jpeg]                          full keyframe
      //   [2][count u16] then per tile
      //        [x u16][y u16][w u16][h u16][len u32][jpeg] changed regions only
      // Only ~5% of a desktop changes between frames, so tiles cut the wire
      // cost ~18x. That is what makes this usable on a phone.
      const buf = ev.data, dv = new DataView(buf);
      const kind = dv.getUint8(0);

      if (kind === 1) {
        const w = dv.getUint16(1), h = dv.getUint16(3);
        const bmp = await createImageBitmap(new Blob([buf.slice(5)], {type:"image/jpeg"}));
        if (w !== imgW || h !== imgH) {
          imgW = w; imgH = h; canvas.width = w; canvas.height = h; fit();
        }
        ctx.drawImage(bmp, 0, 0); bmp.close();

      } else if (kind === 2) {
        const count = dv.getUint16(1);
        let off = 3;
        const jobs = [];
        for (let i = 0; i < count; i++) {
          const x = dv.getUint16(off),     y = dv.getUint16(off + 2),
                w = dv.getUint16(off + 4), h = dv.getUint16(off + 6),
                len = dv.getUint32(off + 8);
          off += 12;
          const bytes = buf.slice(off, off + len);
          off += len;
          // Decode every tile in parallel, then paint — decoding one at a time
          // would serialise the whole batch behind the slowest tile.
          jobs.push(createImageBitmap(new Blob([bytes], {type:"image/jpeg"}))
                      .then(bmp => ({bmp, x, y})));
        }
        for (const t of await Promise.all(jobs)) {
          ctx.drawImage(t.bmp, t.x, t.y); t.bmp.close();
        }
      }
    };
  }

  // ── touch ─────────────────────────────────────────────────────────────────
  let t0 = 0, moved = false, last = null, startN = null, twoFinger = false;
  let pinchDist = 0, pinchMid = null;
  const TAP_MS = 250, TAP_SLOP = 12;

  // The password/keys overlay lives INSIDE #stage, so a blanket
  // preventDefault() here eats taps meant for its input and button. On a mouse
  // this never showed up: the mouse handlers do not preventDefault.
  const inOverlay = e => e.target && e.target.closest && e.target.closest("#msg");

  stage.addEventListener("touchstart", e => {
    if (inOverlay(e)) return;
    e.preventDefault();
    t0 = Date.now(); moved = false;
    twoFinger = e.touches.length >= 2;
    last = {x:e.touches[0].clientX, y:e.touches[0].clientY};
    if (twoFinger){
      const a = e.touches[0], b = e.touches[1];
      pinchDist = Math.hypot(b.clientX-a.clientX, b.clientY-a.clientY);
      pinchMid  = {x:(a.clientX+b.clientX)/2, y:(a.clientY+b.clientY)/2};
    }
    if(!trackpad && !twoFinger){ startN = toNorm(last.x, last.y); }
  }, {passive:false});

  stage.addEventListener("touchmove", e => {
    if (inOverlay(e)) return;
    e.preventDefault();
    const t = e.touches[0];
    const dx = t.clientX - last.x, dy = t.clientY - last.y;
    if(Math.abs(dx) > 2 || Math.abs(dy) > 2) moved = true;
    if(e.touches.length >= 2){
      twoFinger = true; moved = true;
      const a = e.touches[0], b = e.touches[1];
      const dist = Math.hypot(b.clientX-a.clientX, b.clientY-a.clientY);
      const mx = (a.clientX+b.clientX)/2, my = (a.clientY+b.clientY)/2;
      if (pinchDist > 0){
        // Pinch always zooms the VIEW — it never reaches the Mac.
        const ratio = dist / pinchDist;
        if (Math.abs(ratio - 1) > 0.002) zoomAt(ratio, mx, my);
        // Moving both fingers together pans while zoomed in (you need to reach
        // the rest of the desktop); at fit there is nothing to pan, so the same
        // gesture scrolls the Mac instead, which is what it did before.
        const ddx = mx - pinchMid.x, ddy = my - pinchMid.y;
        if (zoom > 1.02){
          panX += ddx; panY += ddy; layout();
        } else if (Math.abs(ddx) > 1 || Math.abs(ddy) > 1){
          send({type:"scroll", dx: Math.round(ddx), dy: Math.round(ddy)});
        }
      }
      pinchDist = dist; pinchMid = {x:mx, y:my};
      last = {x:a.clientX, y:a.clientY};
      return;
    } else if(trackpad){
      moveBy(dx, dy);
    } else {
      const n = toNorm(t.clientX, t.clientY);
      cur = n; send({type:"move", x:n.x, y:n.y});
    }
    last = {x:t.clientX, y:t.clientY};
  }, {passive:false});

  stage.addEventListener("touchend", e => {
    if (inOverlay(e)) return;
    e.preventDefault();
    const quick = (Date.now() - t0) < TAP_MS && !moved;
    if(quick){
      if(twoFinger){ send({type:"rclick", x:cur.x, y:cur.y}); toast("right click"); }
      else {
        if(!trackpad && startN){ cur = startN; }
        send({type:"click", x:cur.x, y:cur.y});
      }
    }
    twoFinger = false; startN = null; pinchDist = 0; pinchMid = null;
  }, {passive:false});

  // ── mouse (desktop browsers) ──────────────────────────────────────────────
  stage.addEventListener("mousedown", e => {
    const n = toNorm(e.clientX, e.clientY); cur = n; drawCursor();
    send({type:"down", x:n.x, y:n.y});
  });
  stage.addEventListener("mousemove", e => {
    if(e.buttons === 0) return;
    const n = toNorm(e.clientX, e.clientY); cur = n; drawCursor();
    send({type:"move", x:n.x, y:n.y});
  });
  stage.addEventListener("mouseup", e => {
    const n = toNorm(e.clientX, e.clientY); send({type:"up", x:n.x, y:n.y});
  });
  stage.addEventListener("contextmenu", e => {
    e.preventDefault(); const n = toNorm(e.clientX, e.clientY);
    send({type:"rclick", x:n.x, y:n.y});
  });
  stage.addEventListener("wheel", e => {
    e.preventDefault();
    // Trackpad pinch and ctrl+wheel both arrive as a wheel event with ctrlKey.
    if (e.ctrlKey || e.metaKey){
      zoomAt(e.deltaY < 0 ? 1.12 : 1/1.12, e.clientX, e.clientY);
      return;
    }
    send({type:"scroll", dx:-Math.round(e.deltaX), dy:-Math.round(e.deltaY)});
  }, {passive:false});

  // ── keyboard ──────────────────────────────────────────────────────────────
  // A hidden input summons the phone's own keyboard. We read COMMITTED text
  // rather than keycodes: mobile IMEs report keyCode 229 while composing, and
  // autocorrect rewrites whole words after the fact.
  const SENTINEL = "​";      // so Backspace always has something to delete
  function armHidden(){ hidden.value = SENTINEL; }

  hidden.addEventListener("input", () => {
    const v = hidden.value;
    if(v.length > SENTINEL.length){
      send({type:"text", text: v.slice(SENTINEL.length)});
    }
    armHidden();
  });
  hidden.addEventListener("keydown", e => {
    if(e.key === "Backspace" && hidden.value === SENTINEL){
      e.preventDefault(); send({type:"key", key:"Backspace"});
    } else if(e.key === "Enter"){
      e.preventDefault(); send({type:"key", key:"Enter"});
    }
  });

  $("btn-kbd").onclick = () => { armHidden(); hidden.focus(); toast("keyboard — type to send"); };

  // sticky modifiers + special keys
  document.querySelectorAll("#keys button").forEach(b => {
    b.onclick = () => {
      const m = b.dataset.mod, k = b.dataset.key;
      if(m){
        if(mods.has(m)){ mods.delete(m); b.classList.remove("on"); }
        else { mods.add(m); b.classList.add("on"); }
      } else if(k){
        send({type:"key", key:k});
        mods.clear();
        document.querySelectorAll("#keys button.on").forEach(x=>x.classList.remove("on"));
      }
    };
  });

  // ── toolbar ───────────────────────────────────────────────────────────────
  $("btn-mode").onclick = () => {
    trackpad = !trackpad;
    $("btn-mode").textContent = trackpad ? "Trackpad" : "Direct";
    $("mode-label").textContent = trackpad ? "trackpad" : "direct tap";
    drawCursor();
    toast(trackpad ? "Trackpad: drag to move, tap to click"
                   : "Direct: tap exactly where you want to click");
  };
  $("btn-left").onclick  = () => { send({type:"click",  x:cur.x, y:cur.y}); toast("left click"); };
  $("btn-right").onclick = () => { send({type:"rclick", x:cur.x, y:cur.y}); toast("right click"); };
  $("btn-fit").onclick     = () => { fit(); toast("fit to screen"); };
  $("btn-zoomin").onclick  = () => { zoomCentre(1.25); toast(zoom.toFixed(1)+"×"); };
  $("btn-zoomout").onclick = () => { zoomCentre(1/1.25); toast(zoom > 1.02 ? zoom.toFixed(1)+"×" : "fit"); };

  function askForToken(msg){
    setState("password needed", "");
    const m = $("msg");
    m.style.display = "flex";
    m.innerHTML =
      '<div style="max-width:330px">' +
      '<div style="font-weight:700;color:var(--txt);margin-bottom:6px">Unlock MacBook control</div>' +
      '<div style="margin-bottom:12px">' + (msg ||
        'Enter your dashboard password. The screen key itself never leaves the ' +
        'server \u2014 it is fetched for you and kept on this device.') + '</div>' +
      '<input id="tok-in" type="password" autocomplete="current-password" placeholder="password" ' +
      'style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);' +
      'background:#0d1017;color:var(--txt);font-size:16px;margin-bottom:8px">' +
      '<button id="tok-go" style="width:100%;padding:10px;background:var(--accent);' +
      'border-color:var(--accent);color:#fff">Unlock</button>' +
      '<div id="tok-err" style="color:var(--bad);margin-top:8px;min-height:16px"></div></div>';

    const err = t => { document.getElementById("tok-err").textContent = t || ""; };

    const go = async () => {
      const pw = document.getElementById("tok-in").value;
      if (!pw) return;
      err(""); document.getElementById("tok-go").textContent = "Unlocking…";
      try {
        // 1. exchange the password for a session bearer
        const r = await fetch(API_BASE + "/api/login", {
          method: "POST", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({password: pw})
        });
        if (!r.ok) throw new Error("Incorrect password.");
        const bearer = (await r.json()).token;
        // 2. ask the server for the screen key — it never travels in a URL
        const r2 = await fetch(API_BASE + "/api/screen-token", {
          headers: {"Authorization": "Bearer " + bearer}
        });
        if (r2.status === 503) throw new Error("Screen access is not configured on the server.");
        if (!r2.ok) throw new Error("Server refused to release the screen key.");
        const key = (await r2.json()).token;
        if (!key) throw new Error("Server returned an empty key.");
        try { localStorage.setItem("jarvis_screen_token", key); } catch (e) {}
        location.replace(location.pathname);
      } catch (e) {
        document.getElementById("tok-go").textContent = "Unlock";
        err(e.message || "Could not unlock.");
      }
    };
    document.getElementById("tok-go").onclick = go;
    document.getElementById("tok-in").addEventListener("keydown",
      e => { if (e.key === "Enter") go(); });
    document.getElementById("tok-in").focus();
  }

  window.addEventListener("resize", layout);
  armHidden();
  if (TOKEN) {
    // Drop the token out of the address bar so it is not left in history,
    // screenshots or the back stack.
    if (Q.get("token")) history.replaceState(null, "", location.pathname);
    connect();
  } else {
    askForToken();
  }
})();
</script>
</body>
</html>
