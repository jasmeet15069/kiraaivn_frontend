<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f2f3f6;
  --surface:#ffffff;
  --surface-2:#eef0f4;
  --border:#dde0e7;
  --text:#191b20;
  --text-muted:#666b76;
  --accent:#3860e0;
  --accent-ink:#ffffff;
  --accent-soft:#c9d5f7;
  --user-bubble:#20232b;
  --user-bubble-text:#f4f2ea;
  --danger:#b3432f;
  --danger-soft:#f6ded8;
  --focus:#3860e0;
  --scrollbar:#c7cbd4;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161c;
    --surface:#1b1e26;
    --surface-2:#22252f;
    --border:#2d313d;
    --text:#e9eaee;
    --text-muted:#9298a4;
    --accent:#7c9bff;
    --accent-ink:#0f142b;
    --accent-soft:#28345e;
    --user-bubble:#7c9bff;
    --user-bubble-text:#0f142b;
    --danger:#e08069;
    --danger-soft:#3a201a;
    --focus:#7c9bff;
    --scrollbar:#3a3f4a;
  }
}
:root[data-theme="dark"]{
  --bg:#14161c;
  --surface:#1b1e26;
  --surface-2:#22252f;
  --border:#2d313d;
  --text:#e9eaee;
  --text-muted:#9298a4;
  --accent:#7c9bff;
  --accent-ink:#0f142b;
  --accent-soft:#28345e;
  --user-bubble:#7c9bff;
  --user-bubble-text:#0f142b;
  --danger:#e08069;
  --danger-soft:#3a201a;
  --focus:#7c9bff;
  --scrollbar:#3a3f4a;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:28px 16px;
}
.app{
  width:100%;
  max-width:760px;
  display:flex;
  flex-direction:column;
  height:calc(100vh - 56px);
  min-height:560px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 1px 2px rgba(0,0,0,0.04), 0 12px 32px -16px rgba(0,0,0,0.18);
}

.header{
  display:flex;
  align-items:center;
  gap:14px;
  padding:16px 20px;
  border-bottom:1px solid var(--border);
  background:var(--surface);
  flex-shrink:0;
}
.mark{
  width:36px;height:36px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--accent-soft));
  display:flex;align-items:center;justify-content:center;
  color:var(--accent-ink);
}
.mark svg{width:19px;height:19px;}
.title-block{display:flex;flex-direction:column;gap:1px;min-width:0;}
.title-block h1{margin:0;font-size:15.5px;font-weight:800;letter-spacing:-0.01em;}
.title-block span{font-size:12px;color:var(--text-muted);font-family:'JetBrains Mono',monospace;}
.header-actions{margin-left:auto;display:flex;align-items:center;gap:8px;}

.model-select{
  appearance:none;
  background:var(--surface-2);
  border:1px solid var(--border);
  color:var(--text);
  font-family:'JetBrains Mono',monospace;
  font-size:12.5px;
  font-weight:500;
  padding:8px 30px 8px 12px;
  border-radius:9px;
  cursor:pointer;
  max-width:190px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='none' stroke='%23666b76' stroke-width='1.6'><path d='M5 7.5L10 12.5L15 7.5'/></svg>");
  background-repeat:no-repeat;
  background-position:right 9px center;
  background-size:13px;
}
.model-select:focus-visible{outline:2px solid var(--focus);outline-offset:1px;}

.icon-btn{
  width:34px;height:34px;border-radius:9px;
  border:1px solid var(--border);
  background:var(--surface-2);
  color:var(--text-muted);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;
}
.icon-btn:hover{color:var(--text);border-color:var(--accent);}
.icon-btn:focus-visible{outline:2px solid var(--focus);outline-offset:1px;}
.icon-btn svg{width:16px;height:16px;}

.messages{
  flex:1;
  overflow-y:auto;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:16px;
}
.messages::-webkit-scrollbar{width:8px;}
.messages::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:8px;}

.empty-state{
  margin:auto;
  text-align:center;
  color:var(--text-muted);
  max-width:340px;
  display:flex;flex-direction:column;align-items:center;gap:10px;
}
.empty-state .mark{width:44px;height:44px;}
.empty-state .mark svg{width:22px;height:22px;}
.empty-state h2{font-size:15px;margin:0;color:var(--text);font-weight:700;}
.empty-state p{font-size:13px;line-height:1.6;margin:0;}

.row{display:flex;gap:10px;max-width:88%;}
.row.user{align-self:flex-end;flex-direction:row-reverse;max-width:82%;}
.avatar{
  width:26px;height:26px;border-radius:8px;flex-shrink:0;margin-top:2px;
  display:flex;align-items:center;justify-content:center;font-size:13px;
  background:var(--surface-2);border:1px solid var(--border);
}
.row.user .avatar{background:var(--user-bubble);color:var(--user-bubble-text);border:none;}
.bubble{
  background:var(--surface-2);
  border:1px solid var(--border);
  padding:10px 13px;
  border-radius:13px;
  border-top-left-radius:4px;
  font-size:14px;
  line-height:1.55;
  white-space:pre-wrap;
  word-wrap:break-word;
  min-width:0;
}
.row.user .bubble{
  background:var(--user-bubble);
  color:var(--user-bubble-text);
  border:none;
  border-top-left-radius:13px;
  border-top-right-radius:4px;
}
.row.error .bubble{background:var(--danger-soft);border-color:var(--danger);color:var(--danger);}
.meta{font-size:10.5px;color:var(--text-muted);font-family:'JetBrains Mono',monospace;margin-top:5px;}
.row.user .meta{text-align:right;}

.typing{display:flex;gap:4px;padding:4px 2px;}
.typing span{
  width:6px;height:6px;border-radius:50%;background:var(--text-muted);
  animation:bounce 1.1s infinite ease-in-out;
}
.typing span:nth-child(2){animation-delay:0.15s;}
.typing span:nth-child(3){animation-delay:0.3s;}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:0.5;}30%{transform:translateY(-4px);opacity:1;}}

.attachments-bar{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  padding:12px 16px 0;
  background:var(--surface);
}
.attachment-chip{
  display:flex;
  align-items:center;
  gap:6px;
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:999px;
  padding:5px 8px 5px 10px;
  font-size:12px;
  color:var(--text-muted);
  max-width:220px;
}
.attachment-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.attachment-chip button{
  border:none;background:none;color:var(--text-muted);cursor:pointer;
  width:16px;height:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  border-radius:50%;
}
.attachment-chip button:hover{background:var(--border);color:var(--text);}
.attachment-note{font-size:10.5px;color:var(--text-muted);margin-top:4px;font-style:italic;}

.composer{
  border-top:1px solid var(--border);
  padding:14px 16px;
  display:flex;
  gap:10px;
  align-items:flex-end;
  flex-shrink:0;
  background:var(--surface);
}
.composer textarea{
  flex:1;
  resize:none;
  background:var(--surface-2);
  border:1px solid var(--border);
  color:var(--text);
  font-family:'Manrope',sans-serif;
  font-size:14px;
  line-height:1.5;
  padding:11px 13px;
  border-radius:12px;
  max-height:140px;
  min-height:44px;
}
.composer textarea:focus-visible{outline:2px solid var(--focus);outline-offset:1px;}
.send-btn{
  width:44px;height:44px;border-radius:12px;flex-shrink:0;
  background:var(--accent);
  color:var(--accent-ink);
  border:none;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
}
.send-btn:disabled{opacity:0.45;cursor:not-allowed;}
.send-btn:hover:not(:disabled){filter:brightness(1.06);}
.send-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
.send-btn svg{width:18px;height:18px;}

.tools-panel{
  border-bottom:1px solid var(--border);
  background:var(--surface-2);
  padding:0 20px;
  max-height:0;
  overflow:hidden;
  transition:max-height 0.22s ease, padding 0.22s ease;
  flex-shrink:0;
}
.tools-panel.open{max-height:340px;overflow-y:auto;padding:16px 20px;}
.tools-last-used{
  font-size:12px;
  color:var(--text);
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:8px;
  padding:8px 10px;
  margin-bottom:12px;
}
.tools-group{margin-bottom:14px;}
.tools-group:last-child{margin-bottom:0;}
.tools-group h3{
  margin:0 0 6px;
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:0.05em;
  color:var(--text-muted);
}
.tool-item{
  padding:6px 0;
  border-top:1px solid var(--border);
  font-size:12.5px;
}
.tool-item:first-child{border-top:none;}
.tool-item .tool-name{
  font-family:'JetBrains Mono',monospace;
  font-weight:600;
  color:var(--text);
}
.tool-item .tool-desc{color:var(--text-muted);margin-top:2px;line-height:1.5;}
.tools-empty{font-size:12.5px;color:var(--text-muted);font-style:italic;}

@media (prefers-reduced-motion:reduce){
  .typing span{animation:none;}
  .tools-panel{transition:none;}
}

@media (max-width:480px){
  body{padding:0;}
  .app{max-width:100%;height:100vh;border-radius:0;border:none;}
  .model-select{max-width:120px;}
}
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg>
    </div>
    <div class="title-block">
      <h1>Jarvis</h1>
      <span id="statusLine">Standard</span>
    </div>
    <div class="header-actions">
      <select class="model-select" id="modelSelect" aria-label="Response mode"></select>
      <button class="icon-btn" id="toolsBtn" aria-label="Show available tools" title="Available tools">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg>
      </button>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle light/dark theme" title="Toggle theme">
        <svg id="themeIconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" hidden><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg id="themeIconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </button>
      <button class="icon-btn" id="clearBtn" aria-label="Clear conversation" title="Clear conversation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
      </button>
    </div>
  </div>

  <div class="tools-panel" id="toolsPanel">
    <div class="tools-last-used" id="toolsLastUsed" hidden></div>
    <div id="toolsList"><p class="tools-empty">Loading…</p></div>
  </div>

  <div class="messages" id="messages">
    <div class="empty-state" id="emptyState">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg>
      </div>
      <h2>Good day. How can I help?</h2>
      <p>Pick a response mode above and send a message — I'll take it from there.</p>
    </div>
  </div>

  <div class="attachments-bar" id="attachmentsBar" hidden></div>

  <div class="composer">
    <input type="file" id="fileInput" multiple hidden>
    <button class="icon-btn" id="attachBtn" aria-label="Attach files" title="Attach files">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
    </button>
    <textarea id="messageInput" placeholder="Message Jarvis…" rows="1" aria-label="Message"></textarea>
    <button class="send-btn" id="sendBtn" aria-label="Send message">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
    </button>
  </div>
</div>

<script>
(function(){
  // Fallback list used only if /api/models can't be reached (e.g. backend briefly down).
  var MODELS = [
    {id:'kira-mini-1.0', label:'Lite · Free', provider:'cloud'}
  ];
  var DEFAULT_MODEL = 'kira-mini-1.0';

  function labelFor(id){
    for (var i=0;i<MODELS.length;i++){ if (MODELS[i].id===id) return MODELS[i].label; }
    return id;
  }

  function populateModelSelect(){
    var previous = els.modelSelect.value;
    els.modelSelect.innerHTML = '';
    var groups = { cloud: null, local: null };
    MODELS.forEach(function(m){
      var groupKey = m.provider === 'local' ? 'local' : 'cloud';
      if (!groups[groupKey]){
        groups[groupKey] = document.createElement('optgroup');
        groups[groupKey].label = groupKey === 'local' ? 'Local' : 'Cloud';
        els.modelSelect.appendChild(groups[groupKey]);
      }
      var opt = document.createElement('option');
      opt.value = m.id;
      opt.textContent = m.label;
      groups[groupKey].appendChild(opt);
    });
    var savedModel = safeGet('jarvis_model');
    var candidate = (previous && MODELS.some(function(m){return m.id===previous;})) ? previous
      : (savedModel && MODELS.some(function(m){return m.id===savedModel;})) ? savedModel
      : DEFAULT_MODEL;
    els.modelSelect.value = candidate;
    els.statusLine.textContent = labelFor(els.modelSelect.value);
  }

  function loadModels(){
    fetch('/api/models').then(function(res){
      return res.json();
    }).then(function(data){
      if (Array.isArray(data.models) && data.models.length){
        MODELS = data.models;
        if (data.default) DEFAULT_MODEL = data.default;
      }
      populateModelSelect();
    }).catch(function(){
      populateModelSelect();
    });
  }

  var els = {
    modelSelect: document.getElementById('modelSelect'),
    statusLine: document.getElementById('statusLine'),
    clearBtn: document.getElementById('clearBtn'),
    messages: document.getElementById('messages'),
    emptyState: document.getElementById('emptyState'),
    messageInput: document.getElementById('messageInput'),
    sendBtn: document.getElementById('sendBtn'),
    attachBtn: document.getElementById('attachBtn'),
    fileInput: document.getElementById('fileInput'),
    attachmentsBar: document.getElementById('attachmentsBar'),
    toolsBtn: document.getElementById('toolsBtn'),
    toolsPanel: document.getElementById('toolsPanel'),
    toolsList: document.getElementById('toolsList'),
    toolsLastUsed: document.getElementById('toolsLastUsed'),
    themeBtn: document.getElementById('themeBtn'),
    themeIconSun: document.getElementById('themeIconSun'),
    themeIconMoon: document.getElementById('themeIconMoon')
  };

  var history = [];
  var pendingAttachments = [];

  var MAX_ATTACHMENTS = 4;
  var MAX_ATTACHMENT_BYTES = 5 * 1024 * 1024;
  var TEXTY_RE = /\.(txt|md|csv|json|log|ya?ml|xml|html?|css|js|ts|jsx|tsx|py|rb|go|java|c|cpp|h|hpp|cs|php|sh|sql|ini|conf|env)$/i;

  function safeGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
  function safeSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }

  var sessionId = safeGet('jarvis_session_id');
  if (!sessionId){
    sessionId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('sess-' + Date.now() + '-' + Math.random().toString(16).slice(2));
    safeSet('jarvis_session_id', sessionId);
  }

  loadModels();
  loadHistory();

  var THEME_KEY = 'jarvis_theme';
  function getSystemTheme(){
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  function updateThemeIcon(){
    var active = safeGet(THEME_KEY) || getSystemTheme();
    els.themeIconSun.hidden = active !== 'light';
    els.themeIconMoon.hidden = active !== 'dark';
  }
  function applyTheme(theme){
    if (theme === 'light' || theme === 'dark'){
      document.documentElement.setAttribute('data-theme', theme);
    } else {
      document.documentElement.removeAttribute('data-theme');
    }
    updateThemeIcon();
  }
  applyTheme(safeGet(THEME_KEY));
  els.themeBtn.addEventListener('click', function(){
    var current = safeGet(THEME_KEY) || getSystemTheme();
    var next = current === 'dark' ? 'light' : 'dark';
    safeSet(THEME_KEY, next);
    applyTheme(next);
  });

  function escapeHtml(s){
    var d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
  }

  var toolsLoaded = false;
  els.toolsBtn.addEventListener('click', function(){
    els.toolsPanel.classList.toggle('open');
    if (!toolsLoaded) loadTools();
  });

  function loadTools(){
    toolsLoaded = true;
    fetch('/api/tools').then(function(res){ return res.json(); }).then(function(data){
      renderTools(data);
    }).catch(function(){
      els.toolsList.innerHTML = '<p class="tools-empty">Could not load tools right now.</p>';
    });
  }

  function renderTools(data){
    var groups = {memory: [], sandbox: [], mcp: []};
    (data.tools || []).forEach(function(t){
      if (groups[t.category]) groups[t.category].push(t);
    });
    var labels = {memory: 'Memory', sandbox: 'Sandbox', mcp: 'MCP connector'};
    var html = '';
    ['memory', 'sandbox', 'mcp'].forEach(function(cat){
      if (!groups[cat].length) return;
      html += '<div class="tools-group"><h3>' + labels[cat] + '</h3>' + groups[cat].map(function(t){
        return '<div class="tool-item"><div class="tool-name">' + escapeHtml(t.name) +
          '</div><div class="tool-desc">' + escapeHtml(t.description) + '</div></div>';
      }).join('') + '</div>';
    });
    html += '<div class="tools-group"><h3>System connector</h3>';
    if (data.connectors && data.connectors.length){
      html += data.connectors.map(function(c){
        var status = data.connectors_active ? 'Active.' : 'Configured, but execution is not wired up yet.';
        return '<div class="tool-item"><div class="tool-name">' + escapeHtml(c) +
          '</div><div class="tool-desc">' + status + '</div></div>';
      }).join('');
    } else {
      html += '<p class="tools-empty">No external systems connected. This VPS itself is never a valid target.</p>';
    }
    html += '</div>';
    els.toolsList.innerHTML = html || '<p class="tools-empty">No tools available.</p>';
  }

  function loadHistory(){
    fetch('/api/history?session_id=' + encodeURIComponent(sessionId)).then(function(res){
      return res.json();
    }).then(function(data){
      var msgs = Array.isArray(data.messages) ? data.messages : [];
      if (!msgs.length) return;
      if (els.emptyState) { els.emptyState.remove(); els.emptyState = null; }
      msgs.forEach(function(m){
        addRow(m.role === 'user' ? 'user' : 'assistant', m.content);
        history.push({role: m.role, content: m.content});
      });
    }).catch(function(){ /* no history yet, or backend briefly unreachable */ });
  }

  function renderAttachments(){
    els.attachmentsBar.innerHTML = '';
    els.attachmentsBar.hidden = pendingAttachments.length === 0;
    pendingAttachments.forEach(function(att, idx){
      var chip = document.createElement('div');
      chip.className = 'attachment-chip';
      var label = document.createElement('span');
      label.textContent = (att.kind === 'image' ? '🖼 ' : '📄 ') + att.name;
      var removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.setAttribute('aria-label', 'Remove ' + att.name);
      removeBtn.textContent = '×';
      removeBtn.addEventListener('click', function(){
        pendingAttachments.splice(idx, 1);
        renderAttachments();
      });
      chip.appendChild(label);
      chip.appendChild(removeBtn);
      els.attachmentsBar.appendChild(chip);
    });
  }

  function readFileAsText(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(reader.result); };
      reader.onerror = reject;
      reader.readAsText(file);
    });
  }

  function readFileAsDataURL(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(reader.result); };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  els.attachBtn.addEventListener('click', function(){ els.fileInput.click(); });

  els.fileInput.addEventListener('change', function(){
    var files = Array.from(els.fileInput.files || []);
    els.fileInput.value = '';
    files.forEach(function(file){
      if (pendingAttachments.length >= MAX_ATTACHMENTS) return;
      if (file.size > MAX_ATTACHMENT_BYTES) {
        pendingAttachments.push({name: file.name, kind: 'binary', size: file.size, content: null, tooLarge: true});
        renderAttachments();
        return;
      }
      if (file.type.indexOf('image/') === 0){
        readFileAsDataURL(file).then(function(dataUrl){
          pendingAttachments.push({name: file.name, kind: 'image', size: file.size, content: dataUrl});
          renderAttachments();
        });
      } else if (file.type.indexOf('text/') === 0 || file.type === 'application/json' || TEXTY_RE.test(file.name)){
        readFileAsText(file).then(function(text){
          pendingAttachments.push({name: file.name, kind: 'text', size: file.size, content: text});
          renderAttachments();
        });
      } else {
        pendingAttachments.push({name: file.name, kind: 'binary', size: file.size, content: null});
        renderAttachments();
      }
    });
  });

  els.modelSelect.addEventListener('change', function(){
    els.statusLine.textContent = labelFor(els.modelSelect.value);
    safeSet('jarvis_model', els.modelSelect.value);
  });

  function autoGrow(){
    els.messageInput.style.height = 'auto';
    els.messageInput.style.height = Math.min(els.messageInput.scrollHeight, 140) + 'px';
  }
  els.messageInput.addEventListener('input', autoGrow);
  els.messageInput.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      sendMessage();
    }
  });

  function timeNow(){
    var d = new Date();
    return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  }

  function addRow(role, text, opts){
    opts = opts || {};
    if (els.emptyState) { els.emptyState.remove(); els.emptyState = null; }
    var row = document.createElement('div');
    row.className = 'row ' + role + (opts.error ? ' error' : '');
    var avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? '🙂' : (opts.error ? '⚠' : '◈');
    var col = document.createElement('div');
    col.style.minWidth = '0';
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    var meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = opts.metaText || timeNow();
    col.appendChild(bubble);
    col.appendChild(meta);
    row.appendChild(avatar);
    row.appendChild(col);
    els.messages.appendChild(row);
    els.messages.scrollTop = els.messages.scrollHeight;
    return { row: row, bubble: bubble, meta: meta };
  }

  function addTyping(){
    if (els.emptyState) { els.emptyState.remove(); els.emptyState = null; }
    var row = document.createElement('div');
    row.className = 'row assistant';
    var avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = '◈';
    var bubble = document.createElement('div');
    bubble.className = 'bubble typing';
    bubble.innerHTML = '<span></span><span></span><span></span>';
    row.appendChild(avatar);
    row.appendChild(bubble);
    els.messages.appendChild(row);
    els.messages.scrollTop = els.messages.scrollHeight;
    return row;
  }

  function setBusy(busy){
    els.sendBtn.disabled = busy;
    els.messageInput.disabled = busy;
  }

  function sendMessage(){
    var text = els.messageInput.value.trim();
    var attachments = pendingAttachments;
    if (!text && !attachments.length) return;

    var displayNotes = attachments.map(function(a){
      return (a.kind === 'image' ? '[image: ' : '[file: ') + a.name + ']';
    }).join(' ');
    var displayText = text + (displayNotes ? '\n' + displayNotes : '');

    addRow('user', displayText);
    history.push({role:'user', content:text});
    els.messageInput.value = '';
    pendingAttachments = [];
    renderAttachments();
    autoGrow();

    var typingRow = addTyping();
    setBusy(true);

    var model = els.modelSelect.value;

    fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: model, messages: history, session_id: sessionId, attachments: attachments })
    }).then(function(res){
      return res.json().then(function(data){
        if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
        return data;
      });
    }).then(function(data){
      typingRow.remove();
      var reply = data.reply || '(empty response)';
      var meta = labelFor(model);
      if (Array.isArray(data.used_tools) && data.used_tools.length){
        meta += ' · used ' + data.used_tools.join(', ');
        els.toolsLastUsed.hidden = false;
        els.toolsLastUsed.textContent = 'Last reply used: ' + data.used_tools.join(', ');
      }
      addRow('assistant', reply, {metaText: meta});
      history.push({role:'assistant', content:reply});
    }).catch(function(err){
      typingRow.remove();
      addRow('assistant', 'Request failed: ' + err.message, {error:true});
      history.pop();
    }).finally(function(){
      setBusy(false);
      els.messageInput.focus();
    });
  }

  els.sendBtn.addEventListener('click', sendMessage);

  els.clearBtn.addEventListener('click', function(){
    history = [];
    pendingAttachments = [];
    renderAttachments();
    fetch('/api/history?session_id=' + encodeURIComponent(sessionId), {method: 'DELETE'}).catch(function(){});
    els.messages.innerHTML = '';
    var es = document.createElement('div');
    es.className = 'empty-state';
    es.id = 'emptyState';
    es.innerHTML = '<div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg></div><h2>Good day. How can I help?</h2><p>Pick a response mode above and send a message — I\'ll take it from there.</p>';
    els.messages.appendChild(es);
    els.emptyState = es;
  });
})();
</script>
</body>
</html>
